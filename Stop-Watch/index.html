<!DOCTYPE html>
<html>
    <head>
        <title>Stop watch</title>
        <link rel="stylesheet", href="style.css">
    </head>
    <body>
        <h1 id="my-h1">Stop Watch</h1>
        <div id="container">
            <div id="display">
                00:00:00:00
            </div>
            <div id="my-btn">
                <button id="startbtn" onclick="start()">Start</button>
                <button id="stoptbtn" onclick="stop()">Stop</button>
                <button id="resettbtn" onclick="reset()">Reset</button>
            </div> 
        </div>
        <script src="script.js"></script>
    </body>
</html>
